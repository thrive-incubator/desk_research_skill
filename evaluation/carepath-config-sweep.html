<title>CarePath Config Sweep</title>
<meta name="description" content="Quality, cost and speed for the Stage-1 desk research skill across model and thinking-effort configs." />
<style>
/* Skill-test scoreboard — a measurement report, not a BI dashboard.
 *
 * Palette: cool slate paper + ink (neutrals biased toward the teal chrome
 * accent), three categorical hues for the brief variants, and the reserved
 * status four for score bands and finding severity. Chrome teal never appears
 * on a mark; a status colour never carries identity.
 *
 * Type: three roles — a serif for report headings, the UI sans for prose,
 * and the platform mono for every identifier, score and eyebrow. No webfonts:
 * the Artifact CSP blocks font hosts, so a linked face would fail silently.
 */

:root {
  color-scheme: light;

  --paper: #f4f6f5;
  --card: #fdfdfc;
  --card-sunk: #eef1f0;
  --ink: #141a1b;
  --ink-2: #4b5559;
  --ink-3: #788487;
  --rule: #dee4e2;
  --rule-strong: #c3ccc9;
  --accent: #0f5b63;
  --accent-soft: #e2eeee;

  /* brief variants — categorical slots 1-3, validated light/dark */
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  /* a fourth series: the sweep overlays four configs on one chart */
  --series-4: #8a5cd6;

  /* reserved status four — fixed in both themes */
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --none: #98a3a6;

  --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo,
    Consolas, monospace;

  --measure: 68ch;
  --shadow: 0 1px 2px rgba(20, 26, 27, 0.05), 0 1px 12px rgba(20, 26, 27, 0.03);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0e1112;
    --card: #191c1d;
    --card-sunk: #131617;
    --ink: #eef2f1;
    --ink-2: #a9b4b6;
    --ink-3: #7d888b;
    --rule: #282e2f;
    --rule-strong: #3a4243;
    --accent: #6fc9d2;
    --accent-soft: #17292c;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #a17ce6;
    --none: #6d7679;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0e1112;
  --card: #191c1d;
  --card-sunk: #131617;
  --ink: #eef2f1;
  --ink-2: #a9b4b6;
  --ink-3: #7d888b;
  --rule: #282e2f;
  --rule-strong: #3a4243;
  --accent: #6fc9d2;
  --accent-soft: #17292c;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #a17ce6;
  --none: #6d7679;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.page {
  max-width: 1140px;
  margin-inline: auto;
  padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1rem, 3vw, 2.25rem) 4rem;
  display: flex;
  flex-direction: column;
  gap: 2.75rem;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 600;
  letter-spacing: -0.005em;
  text-wrap: balance;
}

p {
  margin: 0;
  max-width: var(--measure);
}

a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

code,
.mono {
  font-family: var(--mono);
  font-size: 0.86em;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

.eyebrow {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

/* ---------- masthead --------------------------------------------------- */

.masthead {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 1.5rem;
}

.masthead h1 {
  font-size: clamp(1.9rem, 4.4vw, 2.9rem);
  line-height: 1.08;
}

.masthead h1 .eval-id {
  font-family: var(--mono);
  font-size: 0.62em;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink-2);
  display: block;
  margin-top: 0.4rem;
}

.deck {
  font-family: var(--serif);
  font-size: 1.06rem;
  font-style: italic;
  color: var(--ink-2);
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem 1.5rem;
  margin: 0;
  padding-top: 0.5rem;
  border-top: 1px solid var(--rule);
}

.meta-grid dt {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.meta-grid dd {
  margin: 0.15rem 0 0;
  font-family: var(--mono);
  font-size: 0.82rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  overflow-wrap: anywhere;
}

/* ---------- notice: what was not measured ------------------------------ */

.notice {
  background: var(--card);
  border: 1px solid var(--rule);
  border-left: 3px solid var(--warning);
  border-radius: 3px;
  padding: 1.25rem 1.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  box-shadow: var(--shadow);
}

.notice h2 {
  font-size: 1.12rem;
}

.notice p {
  color: var(--ink-2);
  font-size: 0.92rem;
}

.notice-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.notice-list > li {
  display: grid;
  grid-template-columns: minmax(0, 15rem) minmax(0, 1fr);
  gap: 0.15rem 1rem;
  padding-top: 0.55rem;
  border-top: 1px solid var(--rule);
  font-size: 0.9rem;
}

.notice-list > li:first-child {
  border-top: 0;
  padding-top: 0;
}

.notice-key {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--ink);
}

.notice-key .cases {
  display: block;
  color: var(--ink-3);
  font-size: 0.72rem;
  margin-top: 0.15rem;
}

.notice-why {
  color: var(--ink-2);
}

.warn-row {
  display: flex;
  gap: 0.55rem;
  align-items: baseline;
  font-size: 0.9rem;
  color: var(--ink-2);
}

.warn-row .flag {
  color: var(--critical);
  font-weight: 700;
}

/* ---------- controls --------------------------------------------------- */

.controls {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 0.9rem;
  padding: 0.7rem 0.9rem;
  margin-inline: -0.9rem;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-block: 1px solid var(--rule);
}

.controls-label {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.28rem 0.6rem;
  border: 1px solid var(--rule-strong);
  border-radius: 100px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 0.74rem;
  cursor: pointer;
}

.chip[aria-pressed="false"] {
  color: var(--ink-3);
  background: transparent;
}

.chip[aria-pressed="false"] .swatch {
  opacity: 0.3;
}

.swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--series);
  flex: none;
}

.text-button {
  border: 0;
  background: none;
  padding: 0.25rem 0;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 0.74rem;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.spacer {
  margin-left: auto;
}

/* ---------- cards & section headings ----------------------------------- */

.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 3px;
  box-shadow: var(--shadow);
}

.section-head {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  margin-bottom: 1rem;
}

.section-head h2 {
  font-size: 1.5rem;
}

.section-head p {
  color: var(--ink-2);
  font-size: 0.93rem;
}

.scroll-x {
  overflow-x: auto;
}

/* ---------- the meter: the page's signature mark ----------------------- */

/* Ten hairline cells in the track echo the ten-block bar the markdown
 * report prints; the fill is continuous, so nothing is rounded away. */

.meter {
  --band: var(--none);
  position: relative;
  height: 10px;
  width: 100%;
  min-width: 64px;
  border-radius: 2px;
  background: color-mix(in srgb, var(--band) 12%, transparent);
  overflow: hidden;
}

.meter::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to right,
    transparent 0,
    transparent calc(10% - 1px),
    color-mix(in srgb, var(--card) 70%, transparent) calc(10% - 1px),
    color-mix(in srgb, var(--card) 70%, transparent) 10%
  );
}

.meter-fill {
  height: 100%;
  border-radius: 0 4px 4px 0;
  background: var(--band);
}

/* mean +- one standard deviation of the per-run series. Sits above the hatch
 * overlay so it stays visible, and is only ever emitted for a measured score
 * with a non-zero sd — an unmeasured track never carries one. */
.meter-spread {
  position: absolute;
  top: 50%;
  z-index: 1;
  height: 6px;
  transform: translateY(-50%);
  border-left: 1px solid var(--ink-2);
  border-right: 1px solid var(--ink-2);
  background: color-mix(in srgb, var(--ink-2) 22%, transparent);
}

.meter[data-band="good"] {
  --band: var(--good);
}
.meter[data-band="warning"] {
  --band: var(--warning);
}
.meter[data-band="serious"] {
  --band: var(--serious);
}
.meter[data-band="critical"] {
  --band: var(--critical);
}

/* not measured: a hatched empty track — never a zero-length fill */
.meter[data-band="none"] {
  background: repeating-linear-gradient(
    45deg,
    transparent 0 3px,
    color-mix(in srgb, var(--none) 45%, transparent) 3px 4px
  );
  box-shadow: inset 0 0 0 1px var(--rule);
}

.meter[data-band="none"]::after {
  content: none;
}

.meter.thin {
  height: 6px;
}

.score {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.9rem;
  font-weight: 600;
  text-align: right;
}

/* The dispersion rides one step down from the score it qualifies: same line,
 * lighter, so the score stays the thing you read first. */
.score .sd {
  margin-left: 0.35em;
  font-size: 0.78em;
  font-weight: 400;
  color: var(--ink-3);
}

.score.unmeasured {
  font-weight: 400;
  font-size: 0.7rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------- matrix: tests x brief variants ----------------------------- */

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.9rem;
}

th,
td {
  text-align: left;
  padding: 0.5rem 0.7rem;
  vertical-align: middle;
}

thead th {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
  border-bottom: 1px solid var(--rule-strong);
  vertical-align: bottom;
}

tbody tr + tr th,
tbody tr + tr td {
  border-top: 1px solid var(--rule);
}

/* Shared padding for the two full-width panels (glance matrix, deltas). */
.panel {
  padding: 1.3rem;
}

.matrix table {
  min-width: 640px;
}

.matrix .col-group {
  min-width: 12rem;
}

.group-key {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--ink);
  font-size: 0.8rem;
  text-transform: none;
  letter-spacing: 0;
}

.group-key .n {
  color: var(--ink-3);
}

.matrix .test-cell {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.matrix .test-cell .label {
  font-family: var(--sans);
  font-size: 0.88rem;
  color: var(--ink);
}

.matrix .test-id {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-3);
}

.cell-value {
  display: grid;
  grid-template-columns: 1fr 3.1rem;
  align-items: center;
  gap: 0.55rem;
}

.cell-value.absent {
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 0.72rem;
  grid-template-columns: 1fr;
}

/* ---------- group section --------------------------------------------- */

.group {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  scroll-margin-top: 4rem;
}

.group-head {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--rule-strong);
}

.group-head h2 {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--mono);
  font-size: 1.22rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.group-head h2 .rule-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  background: var(--series);
  flex: none;
}

.group-sub {
  font-family: var(--mono);
  font-size: 0.76rem;
  color: var(--ink-3);
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 0.7rem;
}

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.75rem;
}

.tile {
  padding: 0.85rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.tile .label {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.tile .value {
  font-family: var(--sans);
  font-size: 1.22rem;
  font-weight: 600;
  line-height: 1.2;
}

.tile .foot {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-2);
}

/* ---------- the test rows (expanders) ---------------------------------- */

.test-list {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.test {
  border-top: 1px solid var(--rule);
}

.test:first-child {
  border-top: 0;
}

.test > summary {
  display: grid;
  grid-template-columns: 3.4rem minmax(0, 1.15fr) minmax(0, 1.35fr) 8rem 3.4rem 1.1rem;
  align-items: center;
  gap: 0.75rem;
  padding: 0.7rem 1rem;
  cursor: pointer;
  list-style: none;
}

.test > summary::-webkit-details-marker {
  display: none;
}

.test > summary:hover {
  background: var(--card-sunk);
}

.test .t-id {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-3);
}

.test .t-label {
  font-weight: 600;
  font-size: 0.94rem;
}

.test .t-measures {
  color: var(--ink-2);
  font-size: 0.83rem;
}

.test .t-annotation {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-3);
  margin-top: 0.1rem;
  display: block;
}

.chevron {
  width: 1.1rem;
  color: var(--accent);
  transition: transform 120ms ease;
  font-size: 0.7rem;
  text-align: center;
}

.test[open] > summary .chevron {
  transform: rotate(90deg);
}

.test[open] > summary {
  background: var(--card-sunk);
}

.t-body {
  padding: 0.3rem 1rem 1.3rem 4.4rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  background: var(--card-sunk);
}

.t-body h4 {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}

.block {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

/* Statistics behind one test's dispersion, as label-over-value pairs that wrap
 * on a narrow screen rather than forcing the panel to scroll. */
.stat-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.4rem;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}

.stat .label {
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.stat .value {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.85rem;
}

.note.warn {
  color: var(--ink-2);
  border-left: 2px solid var(--warning);
  padding-left: 0.6rem;
}

.unmeasured-note {
  border-left: 2px solid var(--none);
  padding: 0.35rem 0 0.35rem 0.8rem;
  color: var(--ink-2);
  font-size: 0.9rem;
}

.unmeasured-note strong {
  color: var(--ink);
}

.detail-table {
  font-size: 0.85rem;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 3px;
}

.detail-table th,
.detail-table td {
  padding: 0.4rem 0.6rem;
}

.detail-table .num {
  text-align: right;
  white-space: nowrap;
}

/* Run stamps and truth-entry slugs are identifiers — never break them. */
.detail-table code {
  white-space: nowrap;
}

/* ---------- chips: tier, severity, status ------------------------------ */

/* The dot wears the status colour; the text stays in ink. Two of the four
 * status steps sit under 3:1 on the light surface, so colouring the label
 * itself would make the smallest type on the page the least readable. */

.tag {
  --tag-color: var(--none);
  display: inline-flex;
  align-items: center;
  gap: 0.32rem;
  padding: 0.1rem 0.42rem;
  border: 1px solid color-mix(in srgb, var(--tag-color) 45%, var(--rule));
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap;
}

.tag .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--tag-color);
  flex: none;
}

.tag[data-status="critical"] {
  --tag-color: var(--critical);
  color: var(--ink);
}

.tag[data-status="important"],
.tag[data-status="serious"] {
  --tag-color: var(--serious);
  color: var(--ink);
}

.tag[data-status="good"] {
  --tag-color: var(--good);
}

.tag[data-status="warning"] {
  --tag-color: var(--warning);
}

.tag[data-status="none"] {
  --tag-color: var(--none);
  color: var(--ink-3);
  border-style: dashed;
}

/* ---------- run coverage dots ----------------------------------------- */

.run-dots {
  display: inline-flex;
  gap: 3px;
}

.run-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--rule-strong);
  background: transparent;
  flex: none;
}

.run-dot[data-hit="true"] {
  background: var(--ink-2);
  border-color: var(--ink-2);
}

.dot-legend {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--ink-3);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.dot-legend span {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}

/* ---------- findings -------------------------------------------------- */

.findings {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

/* Queue roles ("representative", "flagged") are longer words than severities. */
.findings.roles {
  --tag-col: 8.6rem;
}

.finding {
  display: grid;
  grid-template-columns: var(--tag-col, 5.6rem) minmax(0, 1fr) auto;
  gap: 0.5rem 0.8rem;
  align-items: baseline;
  padding: 0.5rem 0;
  border-top: 1px solid var(--rule);
  font-size: 0.9rem;
}

.finding:first-of-type {
  border-top: 0;
}

.finding .msg {
  color: var(--ink);
}

.finding .where {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-3);
}

.empty {
  color: var(--ink-3);
  font-size: 0.9rem;
  font-style: italic;
}

/* An aside about how a number was produced — not an empty state. */
.note {
  color: var(--ink-2);
  font-size: 0.82rem;

carepath_exhaustive": {"score": 0.728, "band": "warning", "grid": "adds_value", "criticals": 2}, "carepath_simple": {"score": 0.659, "band": "warning", "grid": "ideal", "criticals": 1}, "carepath_standard": {"score": 0.671, "band": "warning", "grid": "adds_value", "criticals": 1}, "carepath_thin": {"score": 0.721, "band": "warning", "grid": "below_sufficiency", "criticals": 3}}}], "note": "Every test, every brief, every config. Scores are copied from each config's own evaluation — the comparison above is these numbers averaged across the briefs the arms share."}, "test_meta": {"A3_competitor_recall": {"label": "Competitor recall", "measures": "how much of the truth competitor list the runs found (tier-weighted)"}, "A4_competitor_extras": {"label": "Competitor extras", "measures": "off-list competitors named: real finds vs inventions"}, "A5_profile_depth": {"label": "Profile depth", "measures": "how thoroughly the found competitors are profiled"}, "A6_self_claims": {"label": "Planted-claim challenge", "measures": "whether claims planted in the brief were challenged, not echoed"}, "A7_market_method": {"label": "Market method", "measures": "TAM/SAM/SOM method checklist completeness"}, "A8_market_accuracy": {"label": "Market accuracy", "measures": "market figures inside the defensible truth bands"}, "A9_risk_recall": {"label": "Risk recall", "measures": "how much of the truth risk register the runs surfaced"}, "A10_risk_extras": {"label": "Risk extras", "measures": "off-list risks named: real finds vs inventions"}, "A11_verdict": {"label": "Verdict calibration", "measures": "majority verdict inside the defensible band"}, "A12_consistency": {"label": "Internal consistency", "measures": "scorecard vs prose vs radar agreement inside each run"}, "A13_sourcing": {"label": "Sourcing quality", "measures": "web-verified citation quality from score.py (1-5 scaled to 0-1)"}, "A14_dependence": {"label": "Discovery ratio", "measures": "share of load-bearing claims discovered, not e <script>
/* Renders the payload embedded by dashboard/page.py.
 *
 * Every number on the page comes straight out of the payload — nothing is
 * recomputed, averaged or interpolated here. A null score renders as a hatched
 * track plus the words "not measured" and its reason; it must never render as
 * a zero-length fill, because a zero would claim the test ran and failed.
 */

(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("dashboard-data").textContent);
  var root = document.getElementById("dashboard");

  /* ---------- tiny DOM helpers --------------------------------------- */

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      var value = attrs[key];
      if (value === null || value === undefined || value === false) return;
      if (key === "text") node.textContent = value;
      else if (key === "style") node.setAttribute("style", value);
      else if (key === "dataset") {
        Object.keys(value).forEach(function (k) {
          node.dataset[k] = value[k];
        });
      } else node.setAttribute(key, value);
    });
    (kids || []).forEach(function (kid) {
      if (kid) node.appendChild(kid);
    });
    return node;
  }

  function frag(kids) {
    var f = document.createDocumentFragment();
    (kids || []).forEach(function (kid) {
      if (kid) f.appendChild(kid);
    });
    return f;
  }

  /* ---------- formatting -------------------------------------------- */

  function fmtScore(score) {
    return typeof score === "number" ? score.toFixed(2) : "—";
  }

  /* "±0.24", or nothing when there is no dispersion estimate. Never "±0.00"
   * for an absent sd: a real 0.00 means measured-and-perfectly-stable, and the
   * two must not render alike. */
  function fmtSd(variance) {
    var sd = (variance || {}).sd;
    return typeof sd === "number" ? "±" + sd.toFixed(2) : "";
  }

  /* What the ± is, spelled out for the tooltip. */
  function sdTitle(variance) {
    var v = variance || {};
    if (typeof v.sd !== "number") {
      return v.sd_reason || "no run-to-run dispersion recorded";
    }
    return (
      "standard deviation " + v.sd.toFixed(3) + " across " + v.n + " run(s); " +
      "range " + fmtScore(v.min) + "–" + fmtScore(v.max) +
      (v.headline_is_series_mean === false
        ? ". The group score is not the mean of these runs — see the test detail."
        : "")
    );
  }

  function fmtRate(rate) {
    return typeof rate === "number" ? Math.round(rate * 100) + "%" : "—";
  }

  function money(value) {
    if (typeof value !== "number") return "—";
    var units = [[1e9, "B"], [1e6, "M"], [1e3, "K"]];
    for (var i = 0; i < units.length; i++) {
      if (Math.abs(value) >= units[i][0]) {
        return "$" + (value / units[i][0]).toFixed(2).replace(/\.0+$/, "") + units[i][1];
      }
    }
    return "$" + value;
  }

  function duration(seconds) {
    if (typeof seconds !== "number") return "—";
    var mins = Math.floor(seconds / 60);
    return mins + "m " + Math.round(seconds % 60) + "s";
  }

  function cost(usd) {
    return typeof usd === "number" ? "$" + usd.toFixed(2) : "—";
  }

  /* "20260805-140947__carepath_thin__run1" -> "20260805-140947 · run1": the
   * timestamp is what distinguishes runs; the case is already the section. */
  function shortRun(runId) {
    var match = /^(\d{8}-\d{6})__.*__(run\d+)$/.exec(runId);
    return match ? match[1] + " · " + match[2] : runId;
  }

  /* Slots 1-3 carry the brief variants; a fourth group would take neutral
   * ink rather than a generated hue. */
  function seriesColor(index) {
    return index < 3 ? "var(--series-" + (index + 1) + ")" : "var(--ink-3)";
  }

  var STATUS_BY_VALUE = {
    in_band: "good",
    near_band: "warning",
    out_of_band: "critical",
    missing: "none",
    answered_with_evidence: "good",
    flagged_open: "warning",
    answered_echo_only: "serious",
    ignored: "critical",
    challenged: "good",
    repeated_at_face_value: "critical",
    omitted: "serious",
    critical: "critical",
    important: "important",
    standard: "none",
    completed: "good",
    failed: "critical",
    unknown: "none"
  };

  function statusOf(value) {
    return STATUS_BY_VALUE[value] || "none";
  }

  /* ---------- shared components ------------------------------------- */

  function meter(score, band, thin, variance) {
    var sd = (variance || {}).sd;
    var mean = (variance || {}).mean;
    var hasBand = typeof sd === "number" && sd > 0 && typeof mean === "number";
    var track = el("div", {
      class: "meter" + (thin ? " thin" : ""),
      dataset: { band: band || "none" },
      role: "img",
      "aria-label":
        typeof score === "number"
          ? "score " + fmtScore(score) + " of 1.00" +
            (hasBand ? ", run-to-run standard deviation " + sd.toFixed(2) : "")
          : "not measured"
    });
    if (typeof score === "number") {
      var width = Math.max(0, Math.min(1, score)) * 100;
      track.appendChild(el("div", { class: "meter-fill", style: "width:" + width + "%" }));
    }
    /* mean ± sd of the per-run series, so the eye sees how much the number
     * moved between runs. Never drawn on an unmeasured (hatched) track, and
     * never when sd is 0 — there is nothing to span. */
    if (typeof score === "number" && hasBand) {
      var low = Math.max(0, mean - sd) * 100;
      var high = Math.min(1, mean + sd) * 100;
      track.appendChild(
        el("div", {
          class: "meter-spread",
          style: "left:" + low + "%;width:" + (high - low) + "%",
          title: sdTitle(variance)
        })
      );
    }
    return track;
  }

  function scoreCell(test) {
    if (!test.measured) {
      return el("div", { class: "score unmeasured", text: "not measured" });
    }
    var sd = fmtSd(test.variance);
    return el("div", { class: "score num", title: sdTitle(test.variance) }, [
      el("span", { text: fmtScore(test.score) }),
      sd ? el("span", { class: "sd", text: sd }) : null
    ]);
  }

  function tag(label, status) {
    return el("span", { class: "tag", dataset: { status: status || "none" } }, [
      el("i", { class: "dot" }),
      el("span", { text: label })
    ]);
  }

  function runDots(runIds, hitRuns) {
    var hits = {};
    (hitRuns || []).forEach(function (id) {
      hits[id] = true;
    });
    return el(
      "span",
      { class: "run-dots" },
      runIds.map(function (id) {
        return el("i", {
          class: "run-dot",
          dataset: { hit: hits[id] ? "true" : "false" },
          title: shortRun(id) + (hits[id] ? " — found" : " — missed")
        });
      })
    );
  }

  /* One dot per run. What "filled" means changes per test, so every strip
   * says it — and it always means the thing the row's score counts. */
  function dotLegend(filledLabel, emptyLabel) {
    return el("div", { class: "dot-legend" }, [
      el("span", {}, [
        el("i", { class: "run-dot", dataset: { hit: "true" } }),
        el("span", { text: filledLabel || "found" })
      ]),
      el("span", {}, [
        el("i", { class: "run-dot", dataset: { hit: "false" } }),
        el("span", { text: emptyLabel || "missed" })
      ]),
      el("span", { text: "one dot per run, in run order" })
    ]);
  }

  /* A dot strip driven by a per-run status map plus a predicate for "filled". */
  function statusDots(runIds, statuses, isFilled) {
    return el(
      "span",
      { class: "run-dots" },
      runIds.map(function (id) {
        var status = (statuses || {})[id];
        return el("i", {
          class: "run-dot",
          dataset: { hit: isFilled(status) ? "true" : "false" },
          title: shortRun(id) + " — " + (status || "unknown").replace(/_/g, " ")
        });
      })
    );
  }

  function table(headers, rows) {
    var head = el(
      "tr",
      {},
      headers.map(function (h) {
        return el("th", { text: h.label, class: h.numeric ? "num" : null });
      })
    );
    return el("div", { class: "scroll-x" }, [
      el("table", { class: "detail-table" }, [
        el("thead", {}, [head]),
        el("tbody", {}, rows)
      ])
    ]);
  }

  function cell(content, numeric) {
    var td = el("td", { class: numeric ? "num" : null });
    td.appendChild(typeof content === "string" ? document.createTextNode(content) : content);
    return td;
  }

  function block(title, kids) {
    return el("div", { class: "block" }, [el("h4", { text: title })].concat(kids));
  }

  /* ---------- masthead ---------------------------------------------- */

  /* Which skill revision produced the graded runs. Sits beside the truth
   * version because the pair is what makes a battery one measurement: one
   * standard grading one skill. More than one version is stated as mixed —
   * the reason travels in DATA.warnings, rendered by notice(). */
  function skillVersionLabel() {
    var versions = Object.keys(DATA.skill_versions || {});
    if (!versions.length) return "unrecorded";
    if (versions.length === 1) return versions[0];
    return versions.length + " versions (mixed): " + versions.join(", ");
  }

  function masthead() {
    var meta = [
      ["Created", (DATA.created_at || "").replace("T", " ").replace("+00:00", " UTC")],
      ["Runs evaluated", String(DATA.n_runs)],
      ["Test coverage", DATA.coverage],
      ["Truth standard", "v" + (DATA.truth_version || "?")],
      ["Skill version", skillVersionLabel()],
      ["Extras judged", DATA.extras_judged ? "yes" : "no"],
      ["Git commit", DATA.git_commit || "n/a"]
    ];
    return el("header", { class: "masthead" }, [
      el("p", { class: "eyebrow", text: "Stage-1 desk research · skill test battery" }),
      el("h1", {}, [
        document.createTextNode("Graded against the truth standard"),
        el("span", { class: "eval-id", text: DATA.evaluation_id })
      ]),
      DATA.label ? el("p", { class: "deck", text: DATA.label }) : null,
      el(
        "dl",
        { class: "meta-grid" },
        meta.reduce(function (kids, pair) {
          return kids.concat([
            el("div", {}, [
              el("dt", { text: pair[0] }),
              el("dd", { text: pair[1] })
            ])
          ]);
        }, [])
      )
    ]);
  }

  /* ---------- which brief to use ------------------------------------ */

  /* The battery's actual conclusion, so it opens the page. The order comes
   * from evaluation/ranking.py — qualification gates first, authoring cost
   * second — and is never sorted here; the composite is shown per row but has
   * no bearing on the position, which is the point of the whole section. */
  function briefRanking() {
    var r = DATA.brief_ranking || {};
    if (!(r.ranked || []).length) return null;

    var rec = r.recommended;
    var lead = [el("p", { class: "eyebrow", text: "Which brief to use" })];

    if (rec) {
      lead.push(
        el("p", { class: "rank-answer" }, [
          el("span", { class: "rank-case mono", text: rec.case }),
          el("span", {
            class: "rank-effort",
            text: "quality " + fmtScore(rec.comparable_score)
          })
        ]),
        el("p", { class: "rank-why", text: rec.why + "." })
      );
    } else {
      lead.push(
        el("p", { class: "rank-answer" }, [
          el("span", { class: "rank-case", text: "No brief qualified" })
        ])
      );
    }
    if (r.note) {
      lead.push(
        el("p", {
          class: r.separated === false ? "rank-note rank-unseparated" : "rank-note",
          text: r.note + "."
        })
      );
    }

    var rows = r.ranked.map(function (row) {
      var verdict = row.qualified
        ? el("span", { class: "rank-ok", text: "qualifies" })
        : el(
            "ul",
            { class: "rank-fails" },
            row.disqualifiers.map(function (why) {
              return el("li", { text: why });
            })
          );

      return el(
        "div",
        { class: "rank-row", dataset: { qualified: String(row.qualified) } },
        [
          el("span", { class: "rank-num num", text: String(row.rank) }),
          el("div", { class: "rank-main" }, [
            el("div", { class: "rank-head" }, [
              el("span", { class: "rank-name mono", text: row.case }),
              el("span", {
                class: "rank-minutes num",
                text: row.input_effort_minutes + " min"
              })
            ]),
            el("div", { class: "rank-facts" }, [
              fact("quality", fmtScore(row.comparable_score), "lead"),
              fact("gates", row.runs_passing + "/" + row.n_runs + " runs"),
              fact("discovery", fmtScore(row.median_discovery)),
              fact("grid", (row.grid || "—").replace(/_/g, " ")),
              fact("critical", String(row.criticals)),
              fact("overall", fmtScore(row.overall)),
              /* Carried, never a sort key — see evaluation/ranking.py. */
              fact("effort", row.input_effort_minutes + " min", "muted")
            ]),
            verdict
          ])
        ]
      );
    });

    var criteria = (r.criteria || []).map(function (c) {
      return el("li", { text: c });
    });

    var unranked = Object.keys(r.unranked || {}).map(function (caseName) {
      return el("li", { text: caseName + " — " + r.unranked[caseName] });
    });

    return el("section", { class: "ranking card" }, [
      el("div", { class: "rank-lead" }, lead),
      el("div", { class: "rank-rows" }, rows),
      el("details", { class: "rank-criteria" }, [
        el("summary", { text: "How this order is decided" }),
        el("ol", {}, criteria),
        unranked.length
          ? el("div", {}, [
              el("p", { class: "note", text: "Not ranked:" }),
              el("ul", {}, unranked)
            ])
          : null
      ])
    ]);
  }

  function fact(label, value, weight) {
    return el("span", { class: "rank-fact", dataset: { weight: weight || "" } }, [
      el("span", { class: "rank-fact-label", text: label }),
      el("span", { class: "rank-fact-value num", text: value })
    ]);
  }

  /* ---------- the overall score ------------------------------------- */

  /* The one number for the battery, and the per-brief numbers behind it.
   * Every value here is read from the payload; the composite and its bands are
   * computed in evaluation/overall.py and dashboard/collect.py, so this page
   * and the markdown report cannot disagree about the score. */
  function batteryHeadline() {
    var o = DATA.overall || {};
    if (DATA.overall_dropped) {
      return el("section", { class: "overall overall-absent card" }, [
        el("p", { class: "eyebrow", text: "Overall" }),
        el("p", {
          class: "note",
          text:
            "Not shown. This is a --only-measured build, so tests were filtered " +
            "out and the battery composite no longer describes what is on the page."
        })
      ]);
    }
    if (typeof o.score !== "number") {
      if (!o.cases_dropped) return null;
      return el("section", { class: "overall overall-absent card" }, [
        el("p", { class: "eyebrow", text: "Overall" }),
        el("p", {
          class: "note",
          text: "Not scored — no brief variant produced a composite."
        })
      ]);
    }

    var bars = (o.cases || []).map(function (row) {
      return el("div", { class: "overall-case" }, [
        el("span", { class: "overall-case-name mono", text: row.case }),
        meter(row.score, row.band, true),
        el("span", {
          class: "overall-case-score num",
          text: typeof row.score === "number" ? fmtScore(row.score) : "—"
        })
      ]);
    });

    var foot = [
      (o.cases_scored || 0) + " brief variant" + (o.cases_scored === 1 ? "" : "s") +
        ", weighted equally"
    ];
    if (typeof o.spread === "number") {
      foot.push(
        "spread " + fmtScore(o.spread) + " (best " + o.best_case +
          ", worst " + o.worst_case + ")"
      );
    }
    if ((o.cases_dropped || []).length) {
      foot.push("not averaged: " + o.cases_dropped.join(", "));
    }

    var conflicts = (o.conflicts || []).map(function (conflict) {
      return el("p", { class: "overall-conflict" }, [
        el("span", { class: "mono", text: conflict.case }),
        document.createTextNode(" — " + conflict.why + ".")
      ]);
    });

    return el("section", { class: "overall card" }, [
      el("div", { class: "overall-lead" }, [
        el("p", { class: "eyebrow", text: "Overall score" }),
        el("div", { class: "overall-figure" }, [
          el("span", { class: "overall-score num", dataset: { band: o.band || "none" },
            text: fmtScore(o.score) }),
          el("span", { class: "overall-of", text: "/ 1.00" })
        ]),
        meter(o.score, o.band),
        el("p", { class: "overall-foot", text: foot.join(" · ") })
      ]),
      el("div", { class: "overall-cases" }, bars),
      conflicts.length
        ? el("div", { class: "overall-conflicts" }, conflicts)
        : null
    ]);
  }

  /* ---------- the honesty notice ------------------------------------ */

  function notice() {
    /* Collapse rows only where the reason is word-for-word the same. Two
     * variants can be unmeasured for different reasons — or the same reason
     * with different counts — and merging those would misstate both. */
    var byReason = {};
    var order = [];
    DATA.not_measured.forEach(function (cellData) {
      var key = cellData.test + "\u0000" + cellData.reason;
      if (!byReason[key]) {
        byReason[key] = {
          test: cellData.test,
          label: cellData.label,
          reason: cellData.reason,
          cases: []
        };
        order.push(key);
      }
      byReason[key].cases.push(cellData.case);
    });
    var entries = order
      .map(function (key) {
        return byReason[key];
      })
      .sort(function (a, b) {
        return DATA.test_order.indexOf(a.test) - DATA.test_order.indexOf(b.test);
      });

    if (!entries.length && !DATA.warnings.length && !DATA.excluded_runs.length) {
      return null;
    }

    var kids = [
      el("p", { class: "eyebrow", text: "read this first" }),
      el("h2", { text: "What this battery did not measure" }),
      el("p", {
        text:
          "These tests produced no score. They are shown throughout as a hatched " +
          "track and the words “not measured” — never as a zero, and never left " +
          "out of a table. A missing score says the input was missing, not that " +
          "the run did badly."
      })
    ];

    if (entries.length) {
      kids.push(
        el(
          "ul",
          { class: "notice-list" },
          entries.map(function (entry) {
            return el("li", {}, [
              el("div", { class: "notice-key" }, [
                el("span", { text: entry.label }),
                el("span", { class: "cases", text: entry.cases.join(" · ") })
              ]),
              el("div", { class: "notice-why", text: entry.reason })
            ]);
          })
        )
      );
    }

    DATA.warnings.forEach(function (warning) {
      kids.push(
        el("div", { class: "warn-row" }, [
          el("span", { class: "flag", text: "!" }),
          el("span", { text: warning })
        ])
      );
    });

    if (DATA.excluded_runs.length) {
      var list = el(
        "ul",
        { class: "notice-list" },
        DATA.excluded_runs.map(function (run) {
          return el("li", {}, [
            el("div", { class: "notice-key" }, [el("span", { text: run.run_id })]),
            el("div", { class: "notice-why", text: run.reason })
          ]);
        })
      );
      kids.push(
        el("details", { class: "raw" }, [
          el("summary", {
            text: "Runs excluded from this evaluation (" + DATA.excluded_runs.length + ")"
          }),
          list
        ])
      );
    }

    return el("section", { class: "notice" }, kids);
  }

  /* ---------- controls ---------------------------------------------- */

  function controls() {
    var chips = DATA.groups.map(function (group, index) {
      var chip = el(
        "button",
        {
          class: "chip",
          type: "button",
          "aria-pressed": "true",
          dataset: { case: group.case },
          style: "--series:" + seriesColor(index)
        },
        [el("i", { class: "swatch" }), el("span", { text: group.case })]
      );
      chip.addEventListener("click", function () {
        var on = chip.getAttribute("aria-pressed") === "true";
        chip.setAttribute("aria-pressed", on ? "false" : "true");
        applyVisibility();
      });
      return chip;
    });

    var expand = el("button", { class: "text-button", type: "button", text: "Expand all tests" });
    var collapse = el("button", { class: "text-button", type: "button", text: "Collapse all" });
    expand.addEventListener("click", function () {
      setOpen(true);
    });
    collapse.addEventListener("click", function () {
      setOpen(false);
    });

    return el("div", { class: "controls" }, [
      el("span", { class: "controls-label", text: "brief variant" }),
      el("div", { class: "chip-row" }, chips),
      el("span", { class: "spacer" }),
      expand,
      collapse
    ]);
  }

  function setOpen(open) {
    Array.prototype.forEach.call(root.querySelectorAll("details.test"), function (node) {
      node.open = open;
    });
  }

  function applyVisibility() {
    var hidden = {};
    Array.prototype.forEach.call(root.querySelectorAll(".chip[data-case]"), function (chip) {
      if (chip.getAttribute("aria-pressed") === "false") hidden[chip.dataset.case] = true;
    });
    Array.prototype.forEach.call(root.querySelectorAll("[data-group-scope]"), function (node) {
      node.hidden = !!hidden[node.dataset.groupScope];
    });
  }

  /* ---------- matrix: tests x brief variants ------------------------ */

  function matrix() {
    var headers = [el("th", { text: "Test", style: "min-width:16rem" })];
    DATA.groups.forEach(function (group, index) {
      headers.push(
        el(
          "th",
          { class: "col-group", dataset: { groupScope: group.case } },
          [
            el("div", { class: "group-key" }, [
              el("i", { class: "swatch", style: "--series:" + seriesColor(index) }),
              el("span", { text: group.case }),
              el("span", { class: "n", text: "n=" + group.n_runs })
            ])
          ]
        )
      );
    });

    var rows = DATA.test_order.map(function (testId) {
      var meta = DATA.test_meta[testId] || { label: testId, measures: "" };
      var cells = [
        el("td", {}, [
          el("div", { class: "test-cell" }, [
            el("span", { class: "label", text: meta.label }),
            el("span", { class: "test-id", text: testId })
          ])
        ])
      ];
      DATA.groups.forEach(function (group) {
        var test = group.tests.filter(function (t) {
          return t.id === testId;
        })[0];
        cells.push(el("td", { dataset: { groupScope: group.case } }, [matrixCell(test)]));
      });
      return el("tr", {}, cells);
    });

    return el("section", { class: "card panel matrix" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "at a glance" }),
        el("h2", { text: "The battery, variant by variant" }),
        el("p", {
          text:
            "Each cell is one test's group score, 0–1, with ± the standard " +
            "deviation across that variant's runs and a band on the track " +
            "spanning it. Rows are the full battery in report order; a hatched " +
            "cell was not measured for that variant."
        }),
        el("p", {
          class: "note",
          text:
            "At three runs per variant a standard deviation is indicative, not " +
            "a confidence interval — it says whether a score moved, not how " +
            "precisely it is known. A blank ± means the series was a single " +
            "run; ±0.00 means every run scored the same."
        })
      ]),
      el("div", { class: "scroll-x" }, [
        el("table", {}, [el("thead", {}, [el("tr", {}, headers)]), el("tbody", {}, rows)])
      ])
    ]);
  }

  function matrixCell(test) {
    if (!test) {
      return el("div", { class: "cell-value absent", text: "not in this evaluation" });
    }
    return el("div", { class: "cell-value" }, [
      meter(test.score, test.band, false, test.variance),
      scoreCell(test)
    ]);
  }

  /* ---------- group sections --------------------------------------- */

  function groupSection(group, index) {
    var sub = [
      group.n_runs + " run" + (group.n_runs === 1 ? "" : "s"),
      (group.skill_models.join(", ") || "model unknown"),
      (group.pre_research || "unknown") + " pre-research"
    ];
    if (typeof group.input_effort_minutes === "number") {
      sub.push(group.input_effort_minutes + " min brief effort");
    }

    return el(
      "section",
      { class: "group", dataset: { groupScope: group.case }, id: "group-" + group.case },
      [
        el("div", { class: "group-head" }, [
          el("h2", {}, [
            el("i", { class: "rule-swatch", style: "--series:" + seriesColor(index) }),
            el("span", { text: group.case }),
            typeof (group.overall || {}).score === "number"
              ? el("span", {
                  class: "group-overall num",
                  dataset: { band: group.overall.band || "none" },
                  title: "overall score for this brief variant",
                  text: fmtScore(group.overall.score)
                })
              : null
          ]),
          el(
            "div",
            { class: "group-sub" },
            sub.map(function (bit) {
              return el("span", { text: bit });
            })
          )
        ]),
        groupTiles(group),
        familyBreakdown(group),
        el("div", { class: "card test-list" }, group.tests.map(testRow(group))),
        findingsSection(group),
        highlightsSection(group),
        queueSection(group),
        performancePanel(group),
        runsSection(group)
      ]
    );
  }

  function groupTiles(group) {
    var gateFoot =
      typeof group.gates_addressed === "number"
        ? group.gates_addressed + "/" + group.gates_total + " gate questions addressed"
        : "no authored gate questions";
    var counts = Object.keys(group.verdict_counts)
      .map(function (verdict) {
        return verdict + " ×" + group.verdict_counts[verdict];
      })
      .join(", ");

    return el("div", { class: "tiles" }, [
      el("div", { class: "card tile" }, [
        el("span", { class: "label", text: "Majority verdict" }),
        el("span", { class: "value", text: group.majority_verdict || "—" }),
        el("span", { class: "foot", text: counts || "not computed" })
      ]),
      el("div", { class: "card tile" }, [
        el("span", { class: "label", text: "Decision-ready" }),
        el("span", {
          class: "value",
          text:
            group.decision_ready === true
              ? "Yes"
              : group.decision_ready === false
              ? "No"
              : "—"
        }),
        el("span", { class: "foot", text: gateFoot })
      ]),
      el("div", { class: "card tile" }, [
        el("span", { class: "label", text: "Next-steps grid" }),
        el("span", { class: "value", text: (group.grid || "—").replace(/_/g, " ") }),
        el("span", {
          class: "foot",
          text: "pre-research × discovery placement"
        })
      ]),
      repeatabilityTile(group)
    ]);
  }

  /* How stable this variant was across its runs — the median of the per-test
   * standard deviations, and the test that moved most. Lower is steadier; a
   * high value means the group score is an average over runs that disagreed. */
  function repeatabilityTile(group) {
    var r = group.repeatability || {};
    var noisiest = r.noisiest;
    var foot = noisiest
      ? "noisiest: " + noisiest.test.split("_")[0] + " ±" + noisiest.sd.toFixed(2) +
        " · " + r.n_tests + " test" + (r.n_tests === 1 ? "" : "s")
      : r.note || "no dispersion estimate";
    return el("div", { class: "card tile" }, [
      el("span", { class: "label", text: "Repeatability" }),
      el("span", {
        class: "value",
        title: r.note || "",
        text: typeof r.median_sd === "number" ? "±" + r.median_sd.toFixed(2) : "—"
      }),
      el("span", { class: "foot", text: foot })
    ]);
  }

  /* One case's composite, broken down by the 8 families it averages. Eight
   * numbers instead of fourteen, so a case can be read without adding up
   * every test — which is the whole reason the composite exists. */
  function familyBreakdown(group) {
    var o = group.overall || {};
    if (typeof o.score !== "number") return null;

    var rows = (o.families || []).map(function (family) {
      return el("div", { class: "fam-row" }, [
        el("span", {
          class: "fam-name",
          text: (DATA.family_labels || {})[family.family] || family.family
        }),
        meter(family.score, family.band, true),
        el("span", { class: "fam-score num", text: fmtScore(family.score) }),
        el("span", {
          class: "fam-count mono",
          text: family.n_measured + "/" + family.n_tests
        })
      ]);
    });

    (o.families_dropped || []).forEach(function (entry) {
      rows.push(
        el("div", { class: "fam-row fam-dropped" }, [
          el("span", {
            class: "fam-name",
            text: (DATA.family_labels || {})[entry.family] || entry.family
          }),
          meter(null, null, true),
          el("span", { class: "fam-score unmeasured", text: "not measured" }),
          el("span", { class: "fam-count mono", text: "—" })
        ])
      );
    });

    var notes = (o.families_dropped || []).map(function (entry) {
      return el("li", { text: entry.reason });
    });

    return el("div", { class: "card fam-card" }, [
      el("div", { class: "fam-head" }, [
        el("h3", { text: "Overall " + fmtScore(o.score) }),
        el("p", {
          class: "note",
          text:
            "mean of " + (o.families || []).length + " family means · " +
            o.n_measured + "/" + o.n_tests + " tests measured · " +
            "flat mean of the same tests " +
            (typeof o.unweighted_mean === "number" ? fmtScore(o.unweighted_mean) : "—")
        })
      ]),
      el("div", { class: "fam-rows" }, rows),
      notes.length ? el("ul", { class: "fam-notes" }, notes) : null
    ]);
  }

  function testRow(group) {
    return function (test) {
      var summary = el("summary", {}, [
        el("span", { class: "t-id", text: test.id.split("_")[0] }),
        el("span", {}, [
          el("span", { class: "t-label", text: test.label }),
          test.annotation ? el("span", { class: "t-annotation", text: test.annotation }) : null
        ]),
        el("span", { class: "t-measures", text: test.measures }),
        meter(test.score, test.band, false, test.variance),
        scoreCell(test),
        el("span", { class: "chevron", text: "▶", "aria-hidden": "true" })
      ]);
      return el("details", { class: "test" }, [summary, testBody(group, test)]);
    };
  }

  function testBody(group, test) {
    var runIds = group.runs.map(function (run) {
      return run.run_id;
    });
    var kids = [];

    if (!test.measured) {
      kids.push(
        el("p", { class: "unmeasured-note" }, [
          el("strong", { text: "Not measured. " }),
          document.createTextNode(test.reason)
        ])
      );
    }

    var detail = detailFor(test, runIds);
    if (detail) kids.push(detail);

    /* The per-run series and its dispersion. Appended rather than folded into
     * detailFor, so a coverage test keeps its truth-entry table AND gains the
     * per-run scores it never had. */
    var spread = varianceBlock(test);
    if (spread) kids.push(spread);

    if (test.findings.length) {
      kids.push(block("findings from this test", [findingList(test.findings)]));
    }

    kids.push(
      el("details", { class: "raw" }, [
        el("summary", { text: "Underlying values (" + test.id + ")" }),
        el("pre", { text: JSON.stringify(test.detail, null, 2) })
      ])
    );

    return el("div", { class: "t-body" }, kids);
  }

  /* ---------- per-test detail views -------------------------------- */

  function detailFor(test, runIds) {
    var d = test.detail || {};
    if (d.per_entry) return coverageBlock("truth entries", d.per_entry, runIds);
    if (test.id === "B2_withheld_discovery") return withheldBlock(d, runIds);
    if (d.extras) return extrasBlock(d);
    if (d.per_question) return gatesBlock(d, runIds);
    if (d.per_claim) return claimsBlock(d, runIds);
    if (test.id === "A8_market_accuracy") return figuresBlock(d);
    if (test.id === "A7_market_method") return methodBlock(d);
    if (test.id === "A11_verdict") return verdictBlock(d);
    if (test.id === "A16_regulatory_dependence") return regulatoryBlock(d, runIds);
    if (d.per_check) return formatsBlock(d, runIds);
    if (d.per_run) return perRunBlock(d);
    return null;
  }

  /* A16: the stress test's checklist, the rules the runs identified, and the
   * compelled share. Three tables rather than one because the failure modes are
   * different: not running the test, running it on the wrong rule, and running
   * it then discarding the answer. */
  function regulatoryBlock(detail, runIds) {
    var kids = [];

    if ((detail.runs_skipping_test || []).length) {
      kids.push(
        el("p", { class: "note warn" }, [
          el("strong", { text: "Test not run in " + detail.runs_skipping_test.length + " run(s). " }),
          document.createTextNode(
            "SKILL.md makes the stress test mandatory when demand rests on a " +
            "rule, so those runs score zero rather than going unmeasured."
          )
        ])
      );
    }

    if ((detail.per_check || []).length) {
      kids.push(
        el("h4", { text: "The six steps" }),
        table(
          [
            { label: "Step" },
            { label: "Requirement" },
            { label: "Runs" },
            { label: "Pass rate", numeric: true }
          ],
          detail.per_check.map(function (check) {
            return el("tr", {}, [
              cell(el("code", { text: check.id })),
              cell(check.requirement),
              cell(statusDots(runIds, passMap(check), function (s) {
                return s === "pass";
              })),
              cell(fmtRate(check.pass_rate), true)
            ]);
          })
        ),
        dotLegend("done", "not done")
      );
    }

    if ((detail.per_rule || []).length) {
      kids.push(
        el("h4", { text: "Rules the runs identified" }),
        table(
          [
            { label: "Rule" },
            { label: "Tier" },
            { label: "Durability" },
            { label: "Identified in" },
            { label: "Durability stated", numeric: true }
          ],
          detail.per_rule.map(function (rule) {
            return el("tr", {}, [
              cell(el("code", { text: rule.id })),
              cell(tag(rule.tier || "?", statusOf(rule.tier))),
              cell(rule.durability || "—"),
              cell(runDots(runIds, rule.identified_runs)),
              cell(
                (rule.durability_stated_runs || []).length + "/" + runIds.length,
                true
              )
            ]);
          })
        )
      );
    }

    var compelled = detail.compelled || {};
    if (Object.keys(compelled.stated || {}).length) {
      var band = compelled.band || [];
      kids.push(
        el("h4", { text: "Compelled share of demand" }),
        table(
          [
            { label: "Run" },
            { label: "Stated share", numeric: true },
            { label: "In defensible band" }
          ],
          Object.keys(compelled.stated).sort().map(function (runId) {
            var value = compelled.stated[runId];
            var ok = (compelled.in_band || {})[runId];
            return el("tr", {}, [
              cell(el("code", { text: shortRun(runId) })),
              cell(typeof value === "number" ? fmtRate(value) : "not stated", true),
              cell(
                ok === undefined
                  ? document.createTextNode("—")
                  : tag(ok ? "in band" : "outside", ok ? "good" : "important")
              )
            ]);
          })
        )
      );
      if (band.length === 2) {
        kids.push(
          el("p", {
            class: "note",
            text:
              "Defensible band " + fmtRate(band[0]) + "–" + fmtRate(band[1]) +
              (compelled.exceeds_threshold_per_standard
                ? ". Above the ~40% threshold, so Revenue Potential should be " +
                  "scored against the voluntary remainder."
                : "")
          })
        );
      }
      if ((compelled.ignored_own_result_runs || []).length) {
        kids.push(
          el("p", {
            class: "note warn",
            text:
              compelled.ignored_own_result_runs.length + " run(s) quantified the " +
              "compelled share and then scored Revenue Potential against the " +
              "full market — the test was run and its result discarded."
          })
        );
      }
    }

    return kids.length ? block("regulatory dependence", kids) : null;
  }

  /* A1: which of the six spec checks held, in which runs. The group score is a
   * fraction of checks, so without this a 0.67 says nothing about whether the
   * skill dropped a deliverable or merely overran a word range. */
  function formatsBlock(detail, runIds) {
    var rows = (detail.per_check || []).map(function (check) {
      return el("tr", {}, [
        cell(el("code", { text: check.id })),
        cell(check.requirement),
        cell(statusDots(runIds, passMap(check), function (status) {
          return status === "pass";
        })),
        cell(fmtRate(check.pass_rate), true)
      ]);
    });
    var kids = [
      table(
        [
          { label: "Check" },
          { label: "Requirement" },
          { label: "Runs" },
          { label: "Pass rate", numeric: true }
        ],
        rows
      ),
      dotLegend("passed", "failed")
    ];
    if (typeof detail.runs_fully_compliant === "number") {
      kids.push(
        el("p", {
          class: "note",
          text:
            detail.runs_fully_compliant + " of " + detail.n_runs_graded +
            " run(s) passed all six checks. The score above is the median " +
            "fraction of checks passed, not this count — see " +
            "evaluation/formats.py for why."
        })
      );
    }
    var words = detail.word_counts || {};
    var counted = Object.keys(words);
    if (counted.length) {
      kids.push(
        table(
          [
            { label: "Run" },
            { label: "Brief words", numeric: true },
            { label: "Report words", numeric: true },
            { label: "Verdict string" }
          ],
          counted.sort().map(function (runId) {
            var w = words[runId];
            return el("tr", {}, [
              cell(el("code", { text: shortRun(runId) })),
              cell(w.brief_words === null ? "—" : String(w.brief_words), true),
              cell(w.report_words === null ? "—" : String(w.report_words), true),
              cell(w.verdict_string || "—")
            ]);
          })
        )
      );
    }
    return block("spec checks", kids);
  }

  /* per_check carries pass/fail lists; statusDots wants a run -> status map. */
  function passMap(check) {
    var statuses = {};
    (check.passed_runs || []).forEach(function (id) {
      statuses[id] = "pass";
    });
    (check.failed_runs || []).forEach(function (id) {
      statuses[id] = "fail";
    });
    return statuses;
  }

  function coverageBlock(title, entries, runIds) {
    var rows = entries.map(function (entry) {
      return el("tr", {}, [
        cell(el("code", { text: entry.id })),
        cell(tag(entry.tier || "?", statusOf(entry.tier))),
        cell(runDots(runIds, entry.hit_runs)),
        cell(fmtRate(entry.rate), true),
        cell(fmtScore(entry.score), true)
      ]);
    });
    return block(title + " — found per run", [
      dotLegend(),
      table(
        [
          { label: "Entry" },
          { label: "Tier" },
          { label: "Runs" },
          { label: "Found", numeric: true },
          { label: "Score", numeric: true }
        ],
        rows
      )
    ]);
  }

  function withheldBlock(detail, runIds) {
    var kids = [];
    ["competitors", "risks"].forEach(function (kind) {
      var part = detail[kind];
      if (!part || !part.per_entry) return;
      kids.push(
        block(
          "withheld " + kind + " — score " + fmtScore(part.score),
          [coverageTable(part.per_entry, runIds)]
        )
      );
    });
    if (!kids.length) return null;
    return el("div", { class: "block" }, [dotLegend()].concat(kids));
  }

  function coverageTable(entries, runIds) {
    return table(
      [
        { label: "Entry" },
        { label: "Tier" },
        { label: "Runs" },
        { label: "Found", numeric: true }
      ],
      entries.map(function (entry) {
        return el("tr", {}, [
          cell(el("code", { text: entry.id })),
          cell(tag(entry.tier || "?", statusOf(entry.tier))),
          cell(runDots(runIds, entry.hit_runs)),
          cell(fmtRate(entry.rate), true)
        ]);
      })
    );
  }

  var EXTRAS_SHOWN = 25;

  /* Off-list entries answer two questions that fail for different reasons:
   * did the skill make something up (a defect), and did it find real things
   * our list is missing (the skill working). Lead with the second — the truth
   * standard was never meant to be exhaustive. */
  function extrasBlock(detail) {
    var extras = detail.extras || [];
    if (!extras.length) return null;
    var judged = !!detail.judged;
    var shown = extras.slice(0, EXTRAS_SHOWN);
    var finds = detail.real_finds || {};
    var lead = [];

    if (typeof finds.n === "number") {
      lead.push(
        el("div", { class: "stat-row" }, [
          el("div", { class: "stat" }, [
            el("span", { class: "label", text: "Real off-list finds" }),
            el("span", { class: "value num", text: String(finds.n) })
          ]),
          el("div", { class: "stat" }, [
            el("span", { class: "label", text: "Score is precision" }),
            el("span", { class: "value num", text: fmtScore(detail.score) })
          ]),
          el("div", { class: "stat" }, [
            el("span", { class: "label", text: "Candidates for truth/" }),
            el("span", { class: "value num", text: String((finds.truth_candidates || []).length) })
          ])
        ])
      );
      if ((finds.truth_candidates || []).length) {
        lead.push(
          el("div", { class: "truth-candidates" }, [
            el("span", { class: "tc-label", text: "Found by more than one run and not in truth/ — the standard may be incomplete:" }),
            el(
              "div",
              { class: "tc-list" },
              finds.truth_candidates.map(function (name) {
                return el("code", { class: "tc-item", text: name });
              })
            )
          ])
        );
      }
      lead.push(el("p", { class: "note", text: finds.note || "" }));
    }

    var rows = shown.map(function (extra) {
      var cells = [
        cell(extra.name || extra.risk || "—"),
        cell(String((extra.runs || []).length), true),
        cell(extra.recurrent ? tag("recurrent", "warning") : document.createTextNode("—"))
      ];
      if (judged) {
        cells.push(
          cell(tag(extra.verdict || "unjudged", extra.verdict === "real" ? "good" : "critical"))
        );
      }
      return el("tr", {}, cells);
    });

    var headers = [
      { label: "Name" },
      { label: "Runs", numeric: true },
      { label: "Recurrent" }
    ];
    if (judged) headers.push({ label: "Verdict" });

    var kids = lead.concat([table(headers, rows)]);
    if (extras.length > shown.length) {
      kids.push(
        el("p", {
          class: "note",
          text:
            "Showing the first " +
            shown.length +
            " of " +
            extras.length +
            " — the rest are in the underlying values below."
        })
      );
    }
    return block("off-list names the runs added", kids);
  }

  /* The score counts a question as addressed if it was answered with evidence
   * OR explicitly flagged open — so the dots count both, matching gates.py. */
  var ADDRESSED = ["answered_with_evidence", "flagged_open"];

  function gatesBlock(detail, runIds) {
    var rows = (detail.per_question || []).map(function (question) {
      return el("tr", {}, [
        cell(el("code", { text: question.id })),
        cell(tag((question.consensus || "?").replace(/_/g, " "), statusOf(question.consensus))),
        cell(
          statusDots(runIds, question.statuses, function (status) {
            return ADDRESSED.indexOf(status) !== -1;
          })
        ),
        cell((question.flips || []).length ? tag("flips", "warning") : document.createTextNode("—"))
      ]);
    });
    return block("gate questions, question by question", [
      dotLegend("addressed", "echoed or ignored"),
      table(
        [{ label: "Question" }, { label: "Consensus" }, { label: "Runs" }, { label: "Stability" }],
        rows
      )
    ]);
  }

  function claimsBlock(detail, runIds) {
    var claims = detail.per_claim || [];
    if (!claims.length) return null;
    var rows = claims.map(function (claim) {
      return el("tr", {}, [
        cell(el("code", { text: claim.id })),
        cell(
          statusDots(runIds, claim.handlings, function (status) {
            return status === "challenged";
          })
        ),
        cell(fmtRate(claim.challenge_rate), true),
        cell(claim.coin_flip ? tag("coin flip", "warning") : document.createTextNode("—"))
      ]);
    });
    return block("planted claims, challenged or echoed", [
      dotLegend("challenged", "echoed or omitted"),
      table(
        [
          { label: "Claim" },
          { label: "Runs challenged" },
          { label: "Rate", numeric: true },
          { label: "Stability" }
        ],
        rows
      )
    ]);
  }

  function figuresBlock(detail) {
    var perRun = detail.per_run || {};
    var runIds = Object.keys(perRun);
    var figures = ["tam_usd", "sam_usd", "som_usd"];
    var rows = runIds.map(function (runId) {
      var cells = [cell(el("code", { text: shortRun(runId) }))];
      figures.forEach(function (figure) {
        var entry = perRun[runId][figure] || {};
        cells.push(
          cell(
            el("span", {}, [
              el("span", { class: "num", text: money(entry.value) }),
              document.createTextNode(" "),
              tag((entry.status || "missing").replace(/_/g, " "), statusOf(entry.status))
            ])
          )
        );
      });
      return el("tr", {}, cells);
    });
    return block("market figures against the truth bands", [
      table(
        [{ label: "Run" }, { label: "TAM" }, { label: "SAM" }, { label: "SOM" }],
        rows
      )
    ]);
  }

  function methodBlock(detail) {
    var perRun = detail.per_run || {};
    var rows = Object.keys(perRun).map(function (runId) {
      var entry = perRun[runId] || {};
      return el("tr", {}, [
        cell(el("code", { text: shortRun(runId) })),
        cell(fmtScore(entry.score), true),
        cell((entry.done || []).join(", ").replace(/_/g, " ") || "—")
      ]);
    });
    return block("method checklist per run", [
      table(
        [{ label: "Run" }, { label: "Score", numeric: true }, { label: "Checklist items met" }],
        rows
      )
    ]);
  }

  function verdictBlock(detail) {
    var perRun = detail.per_run || {};
    var rows = Object.keys(perRun).map(function (runId) {
      var entry = perRun[runId] || {};
      return el("tr", {}, [
        cell(el("code", { text: shortRun(runId) })),
        cell(entry.verdict || "—"),
        cell((entry.reasons || []).filter(Boolean).join(", ") || "—")
      ]);
    });
    var kids = [
      table([{ label: "Run" }, { label: "Verdict" }, { label: "Gate reasons cited" }], rows)
    ];
    if (typeof detail.reason_alignment_rate === "number") {
      kids.push(
        el("p", {
          class: "note",
          text:
            "Reason alignment " +
            fmtRate(detail.reason_alignment_rate) +
            " · majority inside the defensible band: " +
            (detail.majority_in_band ? "yes" : "no")
        })
      );
    }
    return block("verdict per run", kids);
  }

  function perRunBlock(detail) {
    var perRun = detail.per_run || {};
    var runIds = Object.keys(perRun);
    if (!runIds.length) return null;
    var rows = runIds.map(function (runId) {
      var value = perRun[runId];
      var score = typeof value === "number" ? value : value && value.score;
      var notes =
        value && value.contradictions
          ? value.contradictions.join(" · ")
          : typeof score === "number"
          ? ""
          : "not measured for this run";
      return el("tr", {}, [
        cell(el("code", { text: shortRun(runId) })),
        cell(typeof score === "number" ? fmtScore(score) : "—", true),
        cell(notes || "—")
      ]);
    });
    var kids = [
      table([{ label: "Run" }, { label: "Score", numeric: true }, { label: "Notes" }], rows)
    ];
    if (typeof detail.spread === "number") {
      kids.push(el("p", { class: "note", text: "Spread across runs " + fmtScore(detail.spread) }));
    }
    if (detail.source) {
      kids.push(el("p", { class: "note", text: "Read from " + detail.source }));
    }
    return block("per run", kids);
  }

  /* ---------- findings, highlights, queue, runs -------------------- */

  var SEVERITY_ORDER = ["critical", "important"];

  /* Run-to-run dispersion for one test: the statistics, and the per-run series
   * unless the test's own detail view already tabulated it. Everything here is
   * read from the payload — the page computes no statistics of its own. */
  function varianceBlock(test) {
    var v = test.variance || {};
    if (typeof v.n !== "number") return null;

    var kids = [];
    var facts = [
      ["Runs measured", String(v.n) + (v.n_unmeasured ? " (+" + v.n_unmeasured + " unmeasured)" : "")],
      ["Mean of runs", fmtScore(v.mean)],
      ["Std deviation", typeof v.sd === "number" ? v.sd.toFixed(3) : "—"],
      ["Range", fmtScore(v.min) + " – " + fmtScore(v.max)],
      ["Spread", fmtScore(v.spread)]
    ];
    if (typeof v.cv === "number") facts.push(["Coefficient of variation", v.cv.toFixed(3)]);
    kids.push(
      el(
        "div",
        { class: "stat-row" },
        facts.map(function (pair) {
          return el("div", { class: "stat" }, [
            el("span", { class: "label", text: pair[0] }),
            el("span", { class: "value num", text: pair[1] })
          ]);
        })
      )
    );

    /* Only when the detail view above has not already listed the runs. */
    if (!(test.detail || {}).per_run && v.series) {
      var runs = Object.keys(v.series).sort();
      kids.push(
        table(
          [{ label: "Run" }, { label: "Score", numeric: true }],
          runs.map(function (runId) {
            var value = v.series[runId];
            return el("tr", {}, [
              cell(el("code", { text: shortRun(runId) })),
              cell(
                typeof value === "number" ? fmtScore(value) : "not measured",
                typeof value === "number"
              )
            ]);
          })
        )
      );
    }

    if (typeof v.sd !== "number" && v.sd_reason) {
      kids.push(el("p", { class: "note", text: "No standard deviation: " + v.sd_reason }));
    }
    if (v.headline_is_series_mean === false) {
      kids.push(
        el("p", { class: "note", text: "The group score above is not the mean of these runs. " + (v.note || "") })
      );
    } else if (v.note) {
      kids.push(el("p", { class: "note", text: v.note }));
    }
    if (v.scale === "coarse") {
      kids.push(
        el("p", { class: "note warn", text: "Coarse scale — read the split, not the deviation." })
      );
    }
    return block("run-to-run variation", kids);
  }

  /* Severity says how serious; the blocking flag says whether it vetoes a
   * brief. A missed truth entry is serious enough to read the run but is
   * already paid for in the score, so it is shown as "reported" rather than
   * counted twice as a veto. */
  function findingBadge(finding) {
    if (finding.severity !== "critical") return null;
    var blocks = finding.disqualifying !== false;
    return tag(blocks ? "disqualifying" : "reported, not blocking",
               blocks ? "critical" : "warning");
  }

  function findingList(findings) {
    var ordered = SEVERITY_ORDER.reduce(function (acc, severity) {
      return acc.concat(
        findings.filter(function (f) {
          return f.severity === severity;
        })
      );
    }, []).concat(
      findings.filter(function (f) {
        return SEVERITY_ORDER.indexOf(f.severity) === -1;
      })
    );

    return el(
      "div",
      { class: "findings" },
      ordered.map(function (finding) {
        return el("div", { class: "finding" }, [
          tag(finding.severity || "other", statusOf(finding.severity)),
          findingBadge(finding),
          el("span", { class: "msg", text: finding.message }),
          el("span", { class: "where", text: finding.test || "" })
        ]);
      })
    );
  }

  function findingsSection(group) {
    return el("div", { class: "card tile" }, [
      el("span", { class: "label", text: "Findings" }),
      group.findings.length
        ? findingList(group.findings)
        : el("p", {
            class: "empty",
            text: "None — no run disagreed with the standard on any computed test."
          })
    ]);
  }

  function highlightsSection(group) {
    var parts = [];

    [
      ["A3_competitor_recall", "Truth competitors not found by every run"],
      ["A9_risk_recall", "Truth risks not found by every run"]
    ].forEach(function (pair) {
      var test = group.tests.filter(function (t) {
        return t.id === pair[0];
      })[0];
      if (!test) return;
      var missed = (test.detail.per_entry || []).filter(function (entry) {
        return (entry.rate || 0) < 1;
      });
      if (!missed.length) return;
      parts.push(
        block(
          pair[1],
          missed.map(function (entry) {
            return el("div", { class: "finding" }, [
              tag((entry.tier || "?") + " tier", statusOf(entry.tier)),
              el("span", { class: "msg" }, [
                el("code", { text: entry.id }),
                document.createTextNode(" — found in " + fmtRate(entry.rate) + " of runs")
              ]),
              el("span", { class: "where", text: pair[0].split("_")[0] })
            ]);
          })
        )
      );
    });

    var gates = group.tests.filter(function (t) {
      return t.id === "A15_gates";
    })[0];
    if (gates) {
      var unaddressed = (gates.detail.per_question || []).filter(function (question) {
        return ["answered_with_evidence", "flagged_open"].indexOf(question.consensus) === -1;
      });
      if (unaddressed.length) {
        parts.push(
          block(
            "Gate questions not addressed",
            unaddressed.map(function (question) {
              return el("div", { class: "finding" }, [
                tag((question.consensus || "?").replace(/_/g, " "), statusOf(question.consensus)),
                el("span", { class: "msg" }, [el("code", { text: question.id })]),
                el("span", { class: "where", text: "A15" })
              ]);
            })
          )
        );
      }
    }

    Object.keys(group.missing_sections).forEach(function (section) {
      parts.push(
        block("Extraction gap", [
          el("p", {
            class: "note",
            text:
              "section “" +
              section +
              "” missing for " +
              group.missing_sections[section].join(", ")
          })
        ])
      );
    });

    if (!parts.length) return null;
    return el("details", { class: "card tile" }, [
      el("summary", {}, [el("span", { class: "label", text: "Detail highlights" })]),
      el("div", { class: "block", style: "margin-top:0.7rem" }, parts)
    ]);
  }

  function queueSection(group) {
    if (!group.review_queue.length) return null;
    return el("div", { class: "card tile" }, [
      el("span", { class: "label", text: "Human review queue" }),
      el(
        "div",
        { class: "findings roles" },
        group.review_queue.map(function (entry) {
          return el("div", { class: "finding" }, [
            tag(entry.kind, entry.kind === "flagged" ? "critical" : "none"),
            el("span", { class: "msg", text: entry.reason }),
            el("span", { class: "where", text: shortRun(entry.run_id) })
          ]);
        })
      )
    ]);
  }

  /* A2: what a run of this variant costs and takes, with its run-to-run
   * dispersion. Recorded, not scored — no meter, no band, no contribution to
   * the composite; TESTS.md keeps cost out of the quality number and so does
   * this panel. */
  function performancePanel(group) {
    var p = group.performance || {};
    if (!(p.metrics || []).length) return null;

    var rows = p.metrics.map(function (metric) {
      return el("tr", {}, [
        cell(metric.label),
        cell(String(metric.n), true),
        cell(fmtMetric(metric.id, metric.median), true),
        cell(fmtMetric(metric.id, metric.mean), true),
        cell(typeof metric.sd === "number" ? fmtMetric(metric.id, metric.sd) : "—", true),
        cell(
          fmtMetric(metric.id, metric.min) + " – " + fmtMetric(metric.id, metric.max),
          true
        )
      ]);
    });

    var kids = [
      table(
        [
          { label: "Metric" },
          { label: "Runs", numeric: true },
          { label: "Median", numeric: true },
          { label: "Mean", numeric: true },
          { label: "Std dev", numeric: true },
          { label: "Range", numeric: true }
        ],
        rows
      )
    ];

    if ((p.by_model || []).length) {
      kids.push(
        el("h4", { text: "By model, summed over the group" }),
        table(
          [
            { label: "Model" },
            { label: "Cost", numeric: true },
            { label: "Output tokens", numeric: true },
            { label: "Web searches", numeric: true }
          ],
          p.by_model.map(function (row) {
            return el("tr", {}, [
              cell(el("code", { text: row.model })),
              cell(cost(row.cost_usd), true),
              cell(row.output_tokens.toLocaleString(), true),
              cell(String(row.web_searches), true)
            ]);
