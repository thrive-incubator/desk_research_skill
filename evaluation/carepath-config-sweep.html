          })
        ),
        el("p", {
          class: "note",
          text:
            "The per-model split is the only view of subagent spend — the " +
            "headline token count covers the main thread alone."
        })
      );
    }
    if (p.note) kids.push(el("p", { class: "note", text: p.note }));

    return el("details", { class: "card tile" }, [
      el("summary", {}, [
        el("span", { class: "label", text: "Cost, latency & throughput (A2)" })
      ]),
      el("div", { class: "block", style: "margin-top:0.7rem" }, kids)
    ]);
  }

  /* Cost wants a dollar sign, minutes want one decimal, counts want neither. */
  function fmtMetric(metricId, value) {
    if (typeof value !== "number") return "—";
    if (metricId === "cost_usd") return "$" + value.toFixed(2);
    if (metricId === "duration_minutes") return value.toFixed(1) + "m";
    if (metricId === "output_tokens") return Math.round(value).toLocaleString();
    return value.toFixed(1);
  }

  function runsSection(group) {
    if (!group.runs.length) return null;
    var rows = group.runs.map(function (run) {
      return el("tr", {}, [
        cell(el("code", { text: run.run_id })),
        cell(tag(run.status, statusOf(run.status))),
        cell(run.skill_model || "—"),
        cell(run.verdict || "—"),
        cell(typeof run.discovery_ratio === "number" ? fmtScore(run.discovery_ratio) : "—", true),
        cell(duration(run.duration_s), true),
        cell(cost(run.total_cost_usd), true),
        cell(
          run.roles.length
            ? frag(
                run.roles.map(function (role) {
                  return tag(role, role === "flagged" ? "critical" : "none");
                })
              )
            : document.createTextNode("—")
        )
      ]);
    });
    return el("details", { class: "card tile" }, [
      el("summary", {}, [
        el("span", { class: "label", text: "Runs in this group (" + group.runs.length + ")" })
      ]),
      el("div", { style: "margin-top:0.7rem" }, [
        table(
          [
            { label: "Run" },
            { label: "Status" },
            { label: "Skill model" },
            { label: "Verdict" },
            { label: "Discovery", numeric: true },
            { label: "Duration", numeric: true },
            { label: "Cost", numeric: true },
            { label: "Queue role" }
          ],
          rows
        )
      ])
    ]);
  }

  /* ---------- cross-group deltas ------------------------------------ */

  function crossGroup() {
    if (!DATA.cross_group.length) return null;
    return el(
      "section",
      { class: "card panel deltas" },
      [
        el("div", { class: "section-head" }, [
          el("p", { class: "eyebrow", text: "thinness degradation" }),
          el("h2", { text: "What the thin brief costs" }),
          el("p", {
            text:
              "Per-test score delta, thin minus complete. Bars left of the centre " +
              "line are tests the thin brief did worse on."
          })
        ])
      ].concat(
        DATA.cross_group.map(function (pair) {
          var deltas = pair.deltas_thin_minus_complete || {};
          var rows = DATA.test_order
            .filter(function (testId) {
              return typeof deltas[testId] === "number";
            })
            .map(function (testId) {
              var delta = deltas[testId];
              var width = Math.min(Math.abs(delta), 1) * 50;
              var meta = DATA.test_meta[testId] || { label: testId };
              return el("div", { class: "delta-row" }, [
                el("span", { text: meta.label, class: "t-measures" }),
                el("div", { class: "delta-track" }, [
                  el("i", { class: "zero" }),
                  el("div", {
                    class: "delta-bar",
                    dataset: { sign: delta < 0 ? "down" : "up" },
                    style:
                      delta < 0
                        ? "right:50%;width:" + width + "%"
                        : "left:50%;width:" + width + "%"
                  })
                ]),
                el("span", {
                  class: "score num",
                  text: (delta > 0 ? "+" : "") + delta.toFixed(2)
                })
              ]);
            });
          return el("div", { class: "block" }, [
            el("h4", { text: pair.thin + " − " + pair.complete })
          ].concat(rows.length ? rows : [el("p", { class: "empty", text: "No shared measured tests." })]));
        })
      )
    );
  }

  /* ---------- colophon --------------------------------------------- */

  function colophon() {
    /* The "not measured" swatch documents the hatched meter. With no
     * unmeasured cell on the page it explains nothing, so it is left off. */
    var bands = [
      ["good", "0.80 – 1.00"],
      ["warning", "0.60 – 0.79"],
      ["serious", "0.40 – 0.59"],
      ["critical", "below 0.40"]
    ];
    if (DATA.not_measured.length) bands.push(["none", "not measured"]);
    return el("footer", { class: "colophon" }, [
      el("div", { class: "band-legend" }, [
        el("span", { text: "meter colour:" })
      ].concat(
        bands.map(function (band) {
          return el("span", {}, [
            el("i", {
              style:
                band[0] === "none"
                  ? "background:repeating-linear-gradient(45deg,transparent 0 3px,var(--none) 3px 4px)"
                  : "background:var(--" + band[0] + ")"
            }),
            el("span", { text: band[1] })
          ]);
        })
      )),
      el("p", {
        text:
          "Those colour bands are a reading aid for this page only — the harness " +
          "applies no pass mark to a 0–1 test score. Scores, findings and truth " +
          "entries are copied from results/evaluations/" +
          DATA.evaluation_id +
          ".json; run cost, duration and status come from each run's run.json and " +
          "scores.json. Nothing on this page is recomputed."
      }),
      el("p", {}, [
        document.createTextNode("Regenerate after a new evaluation with "),
        el("code", { text: "python visualize.py" }),
        document.createTextNode(
          ", then republish. The page re-renders from whichever evaluation it is built against."
        )
      ])
    ]);
  }

  /* ================= config sweep: arms side by side ================= */

  /* A sweep page answers a question the per-evaluation page cannot: which
   * config, at what price. Everything is read from the sweep JSON — the
   * Pareto verdicts, the per-test means, the axis bounds — so this page can
   * never disagree with `sweep.py`'s own report. */

  function sweepMasthead() {
    var meta = [
      ["Created", (DATA.created_at || "").replace("T", " ").replace("+00:00", " UTC")],
      ["Arms", String((DATA.arms || []).length)],
      ["Thinking effort", DATA.shared_effort || "mixed"],
      ["Skill version", ((DATA.arms || [])[0] || {}).skill_versions ? (DATA.arms[0].skill_versions.join(", ") || "unrecorded") : "unrecorded"],
      ["Comparable", DATA.comparable ? "yes" : "NO — see below"],
      ["Git commit", DATA.git_commit || "n/a"]
    ];
    return el("header", { class: "masthead" }, [
      el("p", { class: "eyebrow", text: "Stage-1 desk research · five briefs across four configs" }),
      el("h1", {}, [
        document.createTextNode("How little pre-research is enough"),
        el("span", { class: "eval-id", text: (DATA.arms || []).map(function (a) { return a.short; }).join(" · ") })
      ]),
      DATA.label ? el("p", { class: "deck", text: DATA.label }) : null,
      el("dl", { class: "meta-grid" }, meta.map(function (pair) {
        return el("div", {}, [el("dt", { text: pair[0] }), el("dd", { text: pair[1] })]);
      }))
    ]);
  }

  /* The knee, per config — the headline number and whether it holds. */
  function kneeVerdict() {
    var b = DATA.briefs || {};
    var knees = b.knees || [];
    if (!knees.length) return null;

    var distinct = {};
    knees.forEach(function (k) { if (k.brief) distinct[k.brief] = true; });
    var stable = Object.keys(distinct).length <= 1;

    return el("section", { class: "card panel" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "the answer, and whether it holds" }),
        el("h2", { text: stable
          ? "The minimum viable brief is the same on every model"
          : "The minimum viable brief depends on the model" }),
        el("p", {
          text: stable
            ? "The knee sits in the same place whichever model runs the work, so it is a property of the research, not of the runtime."
            : "The knee moves across configs, so \u201chow much pre-research is enough\u201d cannot be answered without saying which model will run it. Read the cheapest knee as a best case, not a plan."
        })
      ]),
      el("div", { class: "knee-grid" }, knees.map(function (k) {
        return el("div", { class: "card knee" + (k.is_reference ? " knee-ref" : "") }, [
          el("div", { class: "knee-head" }, [
            el("span", { class: "knee-model", text: k.short }),
            k.is_reference ? tag("reference", "important") : null
          ]),
          el("span", { class: "knee-brief", text: k.brief || "none qualified" }),
          el("span", { class: "knee-effort num",
            text: typeof k.effort === "number" ? k.effort + " min of authoring" : "no brief cleared the gates" }),
          el("span", { class: "knee-runs",
            text: k.n_runs_per_case === 1
              ? "1 run per brief — a knee at n=1 is a single coin flip"
              : k.n_runs_per_case + " runs per brief" })
        ]);
      }))
    ]);
  }

  /* The effort ladder as numbers. This replaced a line chart deliberately: the
   * quantity that matters is "3 of 3 runs cleared the gates", and a reader
   * gets that from the fraction faster and more exactly than from a y
   * position. The ladder is ordered by authoring cost, cheapest first, so the
   * knee is the first row that goes green all the way across. */
  function briefMatrix() {
    var b = DATA.briefs || {};
    var series = b.series || [];
    var briefs = b.briefs || [];
    if (!series.length || !briefs.length) return null;

    var headers = [el("th", { text: "Brief", style: "min-width:11rem" })];
    series.forEach(function (s) {
      headers.push(el("th", { class: "col-group", text: s.short + (s.is_reference ? " ·ref" : "") }));
    });

    var target = b.target_minutes;
    var rows = briefs.map(function (brief) {
      var atTarget = brief.effort === target;
      var cells = [
        el("td", {}, [
          el("div", { class: "test-cell" }, [
            el("span", { class: "label", text: brief.brief }),
            el("span", { class: "test-id", text: brief.effort + " min to write" }),
            atTarget ? el("span", { class: "target-flag", text: "studio target" }) : null
          ])
        ])
      ];
      series.forEach(function (s) {
        var pt = (s.points || []).filter(function (p) { return p.case === brief.case; })[0];
        /* A cell that never ran and a cell that ran and failed are different
         * facts, and a bare fraction cannot tell them apart. The absent one
         * gets a hatched track and says so; the failed one keeps its meter and
         * names the gate question it skipped. */
        if (!pt) {
          cells.push(el("td", {}, [
            el("div", { class: "cell-value cell-absent" }, [
              meter(null, null),
              el("div", { class: "score unmeasured", text: "not run" }),
              el("div", { class: "cell-note", text: "this brief was never run on this config" })
            ])
          ]));
          return;
        }
        var isKnee = pt.case === s.knee_case;
        var cleared = pt.runs_passing === pt.n_runs;
        var why = cleared
          ? (pt.grid || "").replace(/_/g, " ")
          : "skipped " + (pt.ignored || []).join(", ");
        cells.push(el("td", {}, [
          el("div", { class: "cell-value" + (isKnee ? " cell-knee" : "") }, [
            meter(pt.pass_rate, pt.pass_rate === 1 ? "good" : pt.pass_rate ? "warning" : "critical"),
            el("div", { class: "score num", title: "gate questions addressed: " +
              pt.gates_addressed + " of " + pt.gates_total }, [
              el("span", { text: pt.runs_passing + " of " + pt.n_runs }),
              el("span", { class: "sd", text: "cleared" })
            ]),
            el("div", { class: "cell-note", text: why + (isKnee ? " · knee" : "") }),
            !cleared && pt.gates_total
              ? el("div", { class: "cell-note", text: pt.gates_addressed + "/" + pt.gates_total + " gates · " + (pt.grid || "").replace(/_/g, " ") })
              : null
          ])
        ]));
      });
      return el("tr", { class: atTarget ? "brief-row-target" : null }, cells);
    });

    return el("section", { class: "card panel matrix" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "brief \u00d7 model · cheapest brief first" }),
        el("h2", { text: "Which briefs cleared the gates" }),
        el("p", {
          text:
            "Runs that cleared EVERY gate question, out of that brief's runs. " +
            "Briefs run cheapest first, so the knee is the first row that holds " +
            "all the way across; the ringed cell is that model's knee. Where a " +
            "cell did not clear, it names the question the run skipped \u2014 " +
            "\u201c0 of 1 cleared\u201d is a measured failure, not a missing run, " +
            "and a run that never happened says \u201cnot run\u201d instead."
        })
      ]),
      el("div", { class: "scroll-x" }, [
        el("table", {}, [el("thead", {}, [el("tr", {}, headers)]), el("tbody", {}, rows)])
      ])
    ]);
  }

  /* The headline: one card per arm, ordered best-quality first. */
  function armCards() {
    var arms = DATA.arms || [];
    var cheapest = arms.reduce(function (best, a) {
      return typeof a.median_cost_usd === "number" && (!best || a.median_cost_usd < best.median_cost_usd) ? a : best;
    }, null);
    var byCost = {};
    (DATA.frontier.points || []).forEach(function (p) { byCost[p.config] = p; });

    return el("section", { class: "card panel" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "the third axis · what the model costs" }),
        el("h2", { text: "What running a different model buys and costs" }),
        el("p", {
          text:
            "Quality is the family-weighted composite over the tests that compare " +
            "fairly across briefs. At one run per cell these gaps are indicative, " +
            "not separable — the baseline battery measured per-test deviations as " +
            "wide as ±0.58, wider than the gap between the best and worst arm here."
        })
      ]),
      el("div", { class: "arm-grid" }, arms.map(function (arm, i) {
        var pt = byCost[arm.config] || {};
        var efficient = (DATA.frontier.pareto_efficient || []).indexOf(arm.config) !== -1;
        return el("div", { class: "card arm" + (i === 0 ? " arm-lead" : "") }, [
          el("div", { class: "arm-head" }, [
            el("span", { class: "arm-name", text: arm.short }),
            efficient ? tag("on the frontier", "good") : tag("dominated", "important")
          ]),
          el("div", { class: "arm-score" }, [
            meter(arm.comparable_score, arm.band),
            el("span", { class: "num", text: fmtScore(arm.comparable_score) })
          ]),
          el("div", { class: "arm-facts" }, [
            armFact("Cost / run", cost(pt.median_cost_usd)),
            armFact("Cost / battery", cost(typeof pt.median_cost_usd === "number"
              ? pt.median_cost_usd * (arm.cases || []).length : null)),
            armFact("Briefs", String((arm.cases || []).length)),
            armFact("Critical findings", String(arm.criticals))
          ])
        ]);
      }))
    ]);
  }

  function armFact(label, value) {
    return el("div", { class: "arm-fact" }, [
      el("span", { class: "label", text: label }),
      el("span", { class: "value num", text: value })
    ]);
  }

  /* Model x test, so a reader can see where the models actually differ. */
  function sweepMatrix() {
    var arms = DATA.arms || [];
    var rows = (DATA.quality.tests || []).slice().sort(function (a, b) {
      return (b.spread || 0) - (a.spread || 0);
    });

    var headers = [el("th", { text: "Test", style: "min-width:15rem" })];
    arms.forEach(function (a) {
      headers.push(el("th", { class: "col-group", text: a.short }));
    });
    headers.push(el("th", { class: "num", text: "Spread" }));

    var body = rows.map(function (row) {
      var cells = [
        el("td", {}, [
          el("div", { class: "test-cell" }, [
            el("span", { class: "label", text: row.label }),
            el("span", { class: "test-id", text: row.test })
          ])
        ])
      ];
      arms.forEach(function (a) {
        var v = row.by_config[a.config];
        var best = row.best === a.config && typeof v === "number";
        cells.push(el("td", {}, [
          el("div", { class: "cell-value" + (best ? " cell-best" : "") }, [
            meter(v, row.bands[a.config]),
            typeof v === "number"
              ? el("div", { class: "score num", text: fmtScore(v) })
              : el("div", { class: "score unmeasured", text: "not measured" })
          ])
        ]));
      });
      cells.push(el("td", { class: "num" },
        [el("span", { class: "spread-num", text: typeof row.spread === "number" ? row.spread.toFixed(2) : "—" })]));
      return el("tr", {}, cells);
    });

    var composite = [el("td", {}, [el("strong", { text: "Comparable composite" })])];
    arms.forEach(function (a) {
      composite.push(el("td", {}, [
        el("div", { class: "cell-value" }, [
          meter(a.comparable_score, a.band),
          el("div", { class: "score num", text: fmtScore(a.comparable_score) })
        ])
      ]));
    });
    composite.push(el("td", { class: "num", text: "" }));
    body.push(el("tr", { class: "composite-row" }, composite));

    return el("section", { class: "card panel matrix" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "C1 · quality by config" }),
        el("h2", { text: "Where the models actually differ" }),
        el("p", {
          text:
            "Rows are sorted by spread — the tests where the configs disagree most " +
            "sit at the top. Each cell is the mean of that test's group scores " +
            "across the shared briefs. Highlighted cell is the best arm on that row."
        })
      ]),
      el("div", { class: "scroll-x" }, [
        el("table", {}, [el("thead", {}, [el("tr", {}, headers)]), el("tbody", {}, body)])
      ])
    ]);
  }

  function sweepPerformance() {
    var arms = DATA.arms || [];
    var blocks = (DATA.performance.metrics || []).map(function (metric) {
      var rows = arms.map(function (a) {
        var s = metric.by_config[a.config];
        if (!s) return el("tr", {}, [cell(a.short), cell("—", true), cell("—", true), cell("—", true), cell("—", true)]);
        var f = function (v) { return fmtUnit(metric.unit, v); };
        return el("tr", {}, [
          cell(a.short),
          cell(String(s.n), true),
          cell(f(s.median), true),
          cell(f(s.mean), true),
          cell(f(s.min) + " – " + f(s.max), true)
        ]);
      });
      return el("div", { class: "block" }, [
        el("h4", { text: metric.label }),
        table([{ label: "Config" }, { label: "Runs", numeric: true }, { label: "Median", numeric: true },
               { label: "Mean", numeric: true }, { label: "Range", numeric: true }], rows)
      ]);
    });

    return el("section", { class: "card panel" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "C2 · cost & speed by config" }),
        el("h2", { text: "What a run costs and takes" }),
        el("p", { text: DATA.performance.note || "" })
      ]),
      el("div", { class: "perf-grid" }, blocks)
    ]);
  }

  function fmtUnit(unit, v) {
    if (typeof v !== "number") return "—";
    if (unit === "usd") return "$" + v.toFixed(2);
    if (unit === "minutes") return v.toFixed(1) + "m";
    if (unit === "count") return Math.round(v).toLocaleString();
    return v.toFixed(1);
  }

  /* The caveats. On a page whose whole job is comparison, the reasons a
   * comparison might not hold are not a footnote. */
  function sweepCaveats() {
    var items = [];

    if (!DATA.comparable) {
      ((DATA.comparability || {}).reasons || []).forEach(function (r) {
        items.push({ kind: "critical", title: "Not comparable", body: r });
      });
    }

    var restriction = DATA.restriction || {};
    if (Object.keys(restriction.dropped_by_config || {}).length) {
      var dropped = Object.keys(restriction.dropped_by_config).map(function (c) {
        return c + " also ran " + restriction.dropped_by_config[c].join(", ");
      }).join("; ");
      items.push({
        kind: "important",
        title: "Restricted to " + (restriction.compared_on || []).length + " shared briefs",
        body: "Compared on " + (restriction.compared_on || []).join(", ") +
          ". Excluded: " + dropped + ". Those runs are not lost — they are in " +
          "their own arm's evaluation — but averaging them against arms that " +
          "could not run them would compare different briefs."
      });
    }

    var stability = DATA.stability || {};
    (stability.unmeasurable || []).forEach(function (u) {
      items.push({ kind: "important", title: "C3 not measurable · " + u.config, body: u.reason });
    });
    (stability.configs || []).forEach(function (c) {
      items.push({
        kind: "none",
        title: "C3 · " + c.config,
        body: "median within-case sd " + c.median_sd_across_cases +
          " across " + c.cases_with_an_estimate + " case(s)"
      });
    });

    if (!items.length) return null;

    return el("section", { class: "card panel" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "read the numbers with these attached" }),
        el("h2", { text: "What would make this wrong" })
      ]),
      el("div", { class: "caveat-list" }, items.map(function (item) {
        return el("div", { class: "caveat", dataset: { kind: item.kind } }, [
          el("span", { class: "caveat-title", text: item.title }),
          el("p", { class: "caveat-body", text: item.body })
        ]);
      })),
      el("p", { class: "note", text: stability.note || "" })
    ]);
  }

  /* Every test, every brief, every config — the detail the comparison above
   * averages away. One collapsible matrix per config; the baseline battery
   * comes last and is marked as reference, not as an arm, because it ran on a
   * different skill version. */
  function fullResults() {
    var fr = DATA.full_results || {};
    var blocks = fr.blocks || [];
    if (!blocks.length) return null;

    return el("section", { class: "card panel" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "the whole battery" }),
        el("h2", { text: "Every test, every brief" }),
        el("p", { text: fr.note || "" })
      ]),
      el("div", { class: "result-blocks" }, blocks.map(resultBlock))
    ]);
  }

  function resultBlock(block, index) {
    var cases = block.cases || [];

    var headers = [el("th", { text: "Test", style: "min-width:14rem" })];
    cases.forEach(function (c) {
      var runs = (block.runs_per_case || {})[c];
      headers.push(el("th", { class: "col-group" }, [
        el("div", { class: "group-key" }, [
          el("span", { text: c.replace(/^carepath_/, "") }),
          el("span", { class: "n", text: "n=" + (runs || "?") })
        ])
      ]));
    });

    var rows = (block.rows || []).map(function (row) {
      var cells = [
        el("td", {}, [
          el("div", { class: "test-cell" }, [
            el("span", { class: "label", text: row.label }),
            el("span", { class: "test-id", text: row.test })
          ])
        ])
      ];
      cases.forEach(function (c) {
        var cell = row.by_case[c] || { measured: false };
        cells.push(el("td", {}, [resultCell(cell)]));
      });
      return el("tr", {}, cells);
    });

    // the per-brief composite, so each column has a bottom line
    var footer = [el("td", {}, [el("strong", { text: "Overall" })])];
    cases.forEach(function (c) {
      var o = (block.case_overall || {})[c] || {};
      footer.push(el("td", {}, [
        el("div", { class: "cell-value" }, [
          meter(o.score, o.band),
          el("div", { class: "score num", text: fmtScore(o.score) }),
          o.criticals
            ? el("div", { class: "cell-note crit", text: o.criticals + " critical" })
            : null
        ])
      ]));
    });
    rows.push(el("tr", { class: "composite-row" }, footer));

    var sub = [
      block.config,
      block.n_runs + " run" + (block.n_runs === 1 ? "" : "s"),
      "skill " + block.skill_version
    ].join(" · ");

    return el("details", { class: "result-block", open: index === 0 ? "" : null }, [
      el("summary", {}, [
        el("span", { class: "rb-name", text: block.short }),
        block.is_reference ? tag("reference · different skill version", "important") : null,
        el("span", { class: "rb-sub", text: sub }),
        el("span", { class: "rb-overall num", text: fmtScore(block.overall) }),
        el("span", { class: "chevron", text: "▶", "aria-hidden": "true" })
      ]),
      el("div", { class: "scroll-x" }, [
        el("table", {}, [el("thead", {}, [el("tr", {}, headers)]), el("tbody", {}, rows)])
      ])
    ]);
  }

  /* A cell carries the score, its dispersion where one exists, and — when the
   * test did not run — the reason, never a zero. */
  function resultCell(cell) {
    if (!cell.measured) {
      return el("div", { class: "cell-value" }, [
        meter(null, null),
        el("div", { class: "score unmeasured", text: "not measured" }),
        cell.reason ? el("div", { class: "cell-note", text: cell.reason }) : null
      ]);
    }
    var variance = typeof cell.sd === "number" ? { sd: cell.sd, mean: cell.score, n: cell.n } : null;
    return el("div", { class: "cell-value" }, [
      meter(cell.score, cell.band, false, variance),
      el("div", { class: "score num", title: variance ? sdTitle(variance) : "" }, [
        el("span", { text: fmtScore(cell.score) }),
        variance ? el("span", { class: "sd", text: fmtSd(variance) }) : null
      ]),
      cell.note ? el("div", { class: "cell-note", text: cell.note }) : null
    ]);
  }

  function sweepColophon() {
    return el("footer", { class: "card panel colophon" }, [
      el("div", { class: "section-head" }, [
        el("p", { class: "eyebrow", text: "provenance" }),
        el("h2", { text: "Where these numbers come from" })
      ]),
      el("p", {
        text:
          "Every figure is copied from results/sweeps/, which sweep.py built from " +
          "one evaluation per config. Nothing on this page is recomputed, so it " +
          "cannot disagree with the markdown report beside it."
      }),
      el("p", {}, [
        document.createTextNode("Rebuild after a new arm with "),
        el("code", { text: "python evaluate.py results/ --config <model@effort>" }),
        document.createTextNode(", then "),
        el("code", { text: "python sweep.py" }),
        document.createTextNode(" and "),
        el("code", { text: "python visualize.py --sweep" }),
        document.createTextNode(".")
      ])
    ]);
  }

  /* ---------- assemble --------------------------------------------- */

  if (DATA.kind === "sweep") {
    root.appendChild(
      frag([sweepMasthead(), kneeVerdict(), briefMatrix(),
            armCards(), sweepMatrix(), sweepPerformance(),
            fullResults(), sweepCaveats(), sweepColophon()])
    );
  } else {
    root.appendChild(
      frag(
        [masthead(), briefRanking(), batteryHeadline(), notice(), controls(), matrix()]
          .concat(DATA.groups.map(groupSection))
          .concat([crossGroup(), colophon()])
      )
    );
  }
})();

</script>
